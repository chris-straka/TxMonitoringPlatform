name: Build and Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET dependencies
        run: dotnet restore TxMonitoringPlatform.slnx

      - name: Build .NET solution
        run: dotnet build TxMonitoringPlatform.slnx --configuration Release --no-restore --warnaserror

      - name: Verify .NET formatting
        run: dotnet format TxMonitoringPlatform.slnx --no-restore --verify-no-changes

      - name: Restore local .NET tools
        run: dotnet tool restore

      - name: Verify EF migration snapshot
        run: dotnet ef migrations has-pending-model-changes --project src/TxMonitoring.Detection.Worker --configuration Release --no-build --no-color

      - name: Run regression tests
        run: dotnet test TxMonitoringPlatform.slnx --configuration Release --no-build --collect:"XPlat Code Coverage"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/TxMonitoring.Web.Dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: src/TxMonitoring.Web.Dashboard
        run: npm ci

      - name: Lint dashboard
        working-directory: src/TxMonitoring.Web.Dashboard
        run: npm run lint

      - name: Build dashboard
        working-directory: src/TxMonitoring.Web.Dashboard
        run: npm run build

      - name: Validate Compose model
        run: docker compose config --quiet

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Build and lint Helm chart
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm dependency build chart
          helm lint chart

      - name: Render default and optional Helm resources
        run: |
          helm template tx-monitoring chart --namespace tx-monitoring --output-dir "$RUNNER_TEMP/helm-default"
          helm template tx-monitoring chart \
            --namespace tx-monitoring \
            --output-dir "$RUNNER_TEMP/helm-optional" \
            --set externalSecret.enabled=true \
            --set externalSecret.remoteRefs.postgresConnectionString.key=ci/postgres-connection \
            --set externalSecret.remoteRefs.postgresPassword.key=ci/postgres-password \
            --set istio.enabled=true \
            --set transportSecurity.enabled=true \
            --set transportSecurity.ingestion.secretName=ci-ingestion-mtls \
            --set transportSecurity.edgeGateway.secretName=ci-edge-mtls
          helm lint chart \
            --set externalSecret.enabled=true \
            --set externalSecret.remoteRefs.postgresConnectionString.key=ci/postgres-connection \
            --set externalSecret.remoteRefs.postgresPassword.key=ci/postgres-password \
            --set istio.enabled=true \
            --set transportSecurity.enabled=true \
            --set transportSecurity.ingestion.secretName=ci-ingestion-mtls \
            --set transportSecurity.edgeGateway.secretName=ci-edge-mtls

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Run isolated failure and recovery suite
        run: ./scripts/e2e.sh
