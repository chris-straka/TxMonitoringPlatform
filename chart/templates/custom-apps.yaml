{{- $captureName := include "tx-monitoring.appName" (dict "root" . "name" "capture-gateway") -}}
{{- $ingestionName := include "tx-monitoring.appName" (dict "root" . "name" "ingestion-api") -}}
{{- $detectionName := include "tx-monitoring.appName" (dict "root" . "name" "detection-worker") -}}
{{- $feedName := include "tx-monitoring.appName" (dict "root" . "name" "feed-emulator") -}}
{{- $webApiName := include "tx-monitoring.appName" (dict "root" . "name" "web-api") -}}
{{- $dashboardName := include "tx-monitoring.appName" (dict "root" . "name" "web-dashboard") -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $captureName }}
  labels:
    {{- include "tx-monitoring.labels" . | nindent 4 }}
    {{- include "tx-monitoring.selectorLabels" (dict "root" . "component" "capture-gateway") | nindent 4 }}
spec:
  selector:
    {{- include "tx-monitoring.selectorLabels" (dict "root" . "component" "capture-gateway") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $captureName }}-headless
  labels:
    {{- include "tx-monitoring.labels" . | nindent 4 }}
    {{- include "tx-monitoring.selectorLabels" (dict "root" . "component" "capture-gateway") | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "tx-monitoring.selectorLabels" (dict "root" . "component" "capture-gateway") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $captureName }}
  labels:
    {{- include "tx-monitoring.labels" . | nindent 4 }}
    {{- include "tx-monitoring.selectorLabels" (dict "root" . "component" "capture-gateway") | nindent 4 }}
spec:
  serviceName: {{ $captureName }}-headless
  replicas: {{ .Values.captureGateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "tx-monitoring.selectorLabels" (dict "root" . "component" "capture-gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tx-monitoring.selectorLabels" (dict "root" . "component" "capture-gateway") | nindent 8 }}
      {{- if .Values.istio.sidecarInjection }}
      annotations:
        sidecar.istio.io/inject: "true"
      {{- end }}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: capture-gateway
          image: {{ include "tx-monitoring.image" (dict "root" . "name" "capture-gateway") | quote }}
          imagePullPolicy: {{ .Values.platform.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- include "tx-monitoring.commonEnv" (dict "root" . "serviceName" "TxMonitoring.Capture.Gateway") | nindent 12 }}
            - name: Ingestion__ApiUrl
              value: {{ printf "%s://%s:8081" (ternary "https" "http" .Values.transportSecurity.enabled) $ingestionName | quote }}
            - name: TransportSecurity__Enabled
              value: {{ .Values.transportSecurity.enabled | quote }}
            {{- if .Values.transportSecurity.enabled }}
            - name: TransportSecurity__ClientCertificatePath
              value: /tls/capture/client.pfx
            - name: TransportSecurity__ClientCertificatePassword
              valueFrom:
                secretKeyRef:
                  name: {{ required "transportSecurity.captureGateway.secretName is required when transportSecurity.enabled=true" .Values.transportSecurity.captureGateway.secretName | quote }}
                  key: {{ required "transportSecurity.captureGateway.clientCertificatePasswordKey is required when transportSecurity.enabled=true" .Values.transportSecurity.captureGateway.clientCertificatePasswordKey | quote }}
            - name: TransportSecurity__TrustedServerCaPath
              value: /tls/capture/ca.crt
            {{- end }}
            - name: Buffer__Path
              value: /data/capture-buffer.db
            - name: Buffer__MaxDepth
              value: {{ .Values.captureGateway.buffer.maxDepth | quote }}
            - name: Buffer__SettledIdRetentionHours
              value: {{ .Values.captureGateway.buffer.settledIdRetentionHours | quote }}
            - name: Buffer__QuarantineRetentionHours
              value: {{ .Values.captureGateway.buffer.quarantineRetentionHours | quote }}
            - name: Buffer__QuarantineMaxRows
              value: {{ .Values.captureGateway.buffer.quarantineMaxRows | quote }}
            - name: Uploader__BatchSize
              value: {{ .Values.captureGateway.uploader.batchSize | quote }}
            - name: Uploader__IdleDelayMs
              value: {{ .Values.captureGateway.uploader.idleDelayMs | quote }}
            - name: Uploader__BaseBackoffSeconds
              value: {{ .Values.captureGateway.uploader.baseBackoffSeconds | quote }}
            - name: Uploader__MaxBackoffSeconds
              value: {{ .Values.captureGateway.uploader.maxBackoffSeconds | quote }}
            - name: Uploader__UploadTimeoutSeconds
              value: {{ .Values.captureGateway.uploader.uploadTimeoutSeconds | quote }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: buffer-data
              mountPath: /data
            {{- if .Values.transportSecurity.enabled }}
            - name: capture-mtls
              mountPath: /tls/capture
              readOnly: true
            {{- end }}
          {{- with .Values.captureGateway.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if .Values.transportSecurity.enabled }}
      volumes:
        - name: capture-mtls
          secret:
            secretName: {{ required "transportSecurity.captureGateway.secretName is required when transportSecurity.enabled=true" .Values.transportSecurity.captureGateway.secretName | quote }}
            defaultMode: 0440
            items:
              - key: {{ required "transportSecurity.captureGateway.clientCertificateKey is required when transportSecurity.enabled=true" .Values.transportSecurity.captureGateway.clientCertificateKey | quote }}
                path: client.pfx
              - key: {{ required "transportSecurity.captureGateway.trustedServerCaKey is required when transportSecurity.enabled=true" .Values.transportSecurity.captureGateway.trustedServerCaKey | quote }}
                path: ca.crt
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: buffer-data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.captureGateway.storage.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.captureGateway.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $ingestionName }}
  labels:
    {{- include "tx-monitoring.labels" . | nindent 4 }}
    {{- include "tx-monitoring.selectorLabels" (dict "root" . "component" "ingestion-api") | nindent 4 }}
spec:
  selector:
    {{- include "tx-monitoring.selectorLabels" (dict "root" . "component" "ingestion-api") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 8081
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $ingestionName }}
  labels:
    {{- include "tx-monitoring.labels" . | nindent 4 }}
    {{- include "tx-monitoring.selectorLabels" (dict "root" . "component" "ingestion-api") | nindent 4 }}
spec:
  replicas: {{ .Values.ingestionApi.replicaCount }}
  selector:
    matchLabels:
      {{- include "tx-monitoring.selectorLabels" (dict "root" . "component" "ingestion-api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tx-monitoring.selectorLabels" (dict "root" . "component" "ingestion-api") | nindent 8 }}
      {{- if .Values.istio.sidecarInjection }}
      annotations:
        sidecar.istio.io/inject: "true"
      {{- end }}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ingestion-api
          image: {{ include "tx-monitoring.image" (dict "root" . "name" "ingestion-api") | quote }}
          imagePullPolicy: {{ .Values.platform.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 8081
              protocol: TCP
          env:
            {{- include "tx-monitoring.commonEnv" (dict "root" . "serviceName" "TxMonitoring.Ingestion.Api") | nindent 12 }}
            - name: Kafka__BootstrapServers
              value: {{ .Values.platform.kafka.bootstrapServers | quote }}
            - name: Kafka__EventsTopic
              value: {{ .Values.platform.kafka.eventsTopic | quote }}
            - name: Kafka__ReadinessTimeoutSeconds
              value: {{ .Values.ingestionApi.kafkaReadinessTimeoutSeconds | quote }}
            - name: TransportSecurity__Enabled
              value: {{ .Values.transportSecurity.enabled | quote }}
            {{- if .Values.transportSecurity.enabled }}
            - name: TransportSecurity__TrustedClientCaPath
              value: /tls/ingestion/ca.crt
            - name: TransportSecurity__AllowedClientFingerprintsPath
              value: /tls/ingestion/allowed-client-sha256.txt
            - name: Kestrel__Endpoints__Grpc__Url
              value: https://+:8081
            - name: Kestrel__Endpoints__Grpc__Certificate__Path
              value: /tls/ingestion/server.pfx
            - name: Kestrel__Endpoints__Grpc__Certificate__Password
              valueFrom:
                secretKeyRef:
                  name: {{ required "transportSecurity.ingestion.secretName is required when transportSecurity.enabled=true" .Values.transportSecurity.ingestion.secretName | quote }}
                  key: {{ required "transportSecurity.ingestion.serverCertificatePasswordKey is required when transportSecurity.enabled=true" .Values.transportSecurity.ingestion.serverCertificatePasswordKey | quote }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          {{- if .Values.transportSecurity.enabled }}
          volumeMounts:
            - name: ingestion-mtls
              mountPath: /tls/ingestion
              readOnly: true
          {{- end }}
          {{- with .Values.ingestionApi.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if .Values.transportSecurity.enabled }}
      volumes:
        - name: ingestion-mtls
          secret:
            secretName: {{ required "transportSecurity.ingestion.secretName is required when transportSecurity.enabled=true" .Values.transportSecurity.ingestion.secretName | quote }}
            defaultMode: 0440
            items:
              - key: {{ required "transportSecurity.ingestion.serverCertificateKey is required when transportSecurity.enabled=true" .Values.transportSecurity.ingestion.serverCertificateKey | quote }}
                path: server.pfx
              - key: {{ required "transportSecurity.ingestion.trustedClientCaKey is required when transportSecurity.enabled=true" .Values.transportSecurity.ingestion.trustedClientCaKey | quote }}
                path: ca.crt
              - key: {{ required "transportSecurity.ingestion.allowedClientFingerprintsKey is required when transportSecurity.enabled=true" .Values.transportSecurity.ingestion.allowedClientFingerprintsKey | quote }}
                path: allowed-client-sha256.txt
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $detectionName }}
  labels:
    {{- include "tx-monitoring.labels" . | nindent 4 }}
    {{- include "tx-monitoring.selectorLabels" (dict "root" . "component" "detection-worker") | nindent 4 }}
spec:
  replicas: {{ .Values.detectionWorker.replicaCount }}
  selector:
    matchLabels:
      {{- include "tx-monitoring.selectorLabels" (dict "root" . "component" "detection-worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tx-monitoring.selectorLabels" (dict "root" . "component" "detection-worker") | nindent 8 }}
      {{- if .Values.istio.sidecarInjection }}
      annotations:
        sidecar.istio.io/inject: "true"
      {{- end }}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: detection-worker
          image: {{ include "tx-monitoring.image" (dict "root" . "name" "detection-worker") | quote }}
          imagePullPolicy: {{ .Values.platform.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- include "tx-monitoring.commonEnv" (dict "root" . "serviceName" "TxMonitoring.Detection.Worker") | nindent 12 }}
            - name: ConnectionStrings__TxMonitoringDb
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.platform.applicationSecret.name | quote }}
                  key: {{ .Values.platform.applicationSecret.postgresConnectionStringKey | quote }}
            - name: Kafka__BootstrapServers
              value: {{ .Values.platform.kafka.bootstrapServers | quote }}
            - name: Kafka__GroupId
              value: {{ .Values.detectionWorker.kafkaGroupId | quote }}
            - name: Kafka__EventsTopic
              value: {{ .Values.platform.kafka.eventsTopic | quote }}
            - name: Kafka__AlertsTopic
              value: {{ .Values.platform.kafka.alertsTopic | quote }}
            - name: Kafka__DeadLetterTopic
              value: {{ .Values.platform.kafka.deadLetterTopic | quote }}
            - name: Kafka__ReadinessTimeoutSeconds
              value: {{ .Values.detectionWorker.kafkaReadinessTimeoutSeconds | quote }}
            - name: Consumer__BaseBackoffSeconds
              value: {{ .Values.detectionWorker.consumer.baseBackoffSeconds | quote }}
            - name: Consumer__MaxBackoffSeconds
              value: {{ .Values.detectionWorker.consumer.maxBackoffSeconds | quote }}
            - name: Outbox__IdleDelayMs
              value: {{ .Values.detectionWorker.outbox.idleDelayMs | quote }}
            - name: Outbox__BaseBackoffSeconds
              value: {{ .Values.detectionWorker.outbox.baseBackoffSeconds | quote }}
            - name: Outbox__MaxBackoffSeconds
              value: {{ .Values.detectionWorker.outbox.maxBackoffSeconds | quote }}
            - name: Outbox__PublishedRetentionHours
              value: {{ .Values.detectionWorker.outbox.publishedRetentionHours | quote }}
            - name: Outbox__MaintenanceIntervalSeconds
              value: {{ .Values.detectionWorker.outbox.maintenanceIntervalSeconds | quote }}
            # Velocity cache endpoint only. Redis holds derived velocity windows; Kafka
            # consumption, Postgres persistence, and alerting never depend on it.
            - name: Velocity__Configuration
              value: {{ required "detectionWorker.velocity.configuration must point at an external/managed Redis endpoint" .Values.detectionWorker.velocity.configuration | quote }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with .Values.detectionWorker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
