{{- if .Values.istio.enabled }}
{{- $webApiName := include "tx-monitoring.appName" (dict "root" . "name" "web-api") -}}
{{- $dashboardName := include "tx-monitoring.appName" (dict "root" . "name" "web-dashboard") -}}
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: {{ include "tx-monitoring.fullname" . }}
  labels:
    {{- include "tx-monitoring.labels" . | nindent 4 }}
spec:
  selector:
    {{- toYaml .Values.istio.gatewaySelector | nindent 4 }}
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        {{- toYaml .Values.istio.hosts | nindent 8 }}
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ include "tx-monitoring.fullname" . }}
  labels:
    {{- include "tx-monitoring.labels" . | nindent 4 }}
spec:
  hosts:
    {{- toYaml .Values.istio.hosts | nindent 4 }}
  gateways:
    - {{ include "tx-monitoring.fullname" . }}
  http:
    # The dashboard uses same-origin SignalR, including WebSocket upgrade requests.
    - match:
        - uri:
            prefix: /riskHub
      route:
        - destination:
            host: {{ $webApiName }}
            port:
              number: 8080
    - route:
        - destination:
            host: {{ $dashboardName }}
            port:
              number: 80
{{- end }}
