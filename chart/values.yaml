# This chart is a renderable deployment prototype, not a production claim. Secrets, image
# publishing, storage classes, and the external OTLP collector remain operator concerns.

nameOverride: ""
fullnameOverride: ""

platform:
  environment: Production
  imagePullPolicy: IfNotPresent

  # The chart does not install an OpenTelemetry Collector. Point this at a collector that accepts
  # OTLP/gRPC logs, metrics, and traces before deploying. Export failures do not stop the apps.
  otelEndpoint: http://otel-collector.observability.svc.cluster.local:4317

  kafka:
    # The dependency's fullnameOverride below makes this DNS name deterministic.
    bootstrapServers: tx-monitoring-kafka:9092
    eventsTopic: &eventsTopic transaction-events
    alertsTopic: &alertsTopic risk-alerts
    deadLetterTopic: &deadLetterTopic transaction-events-dlq

  # This Secret is never created with literal values by the chart. Either provision it yourself
  # or enable externalSecret below. It must contain both named keys. The connection string
  # should resemble:
  # Host=tx-monitoring-postgresql;Port=5432;Database=tx_monitoring;Username=txmonitoring;Password=<secret>
  applicationSecret:
    name: tx-monitoring-secrets
    postgresConnectionStringKey: postgres-connection-string
    postgresPasswordKey: postgres-password

# Optional application-level mTLS for the capture-gateway -> ingestion-api gRPC hop. The chart never
# creates these Secrets: provision them before installation (or arrange for another controller to
# do so). Separate Secrets keep each private key visible only to the workload that owns it.
transportSecurity:
  enabled: false
  ingestion:
    secretName: ""
    serverCertificateKey: server.pfx
    serverCertificatePasswordKey: server-pfx-password
    trustedClientCaKey: ca.crt
    allowedClientFingerprintsKey: allowed-client-sha256.txt
  captureGateway:
    secretName: ""
    clientCertificateKey: client.pfx
    clientCertificatePasswordKey: client-pfx-password
    trustedServerCaKey: ca.crt

images:
  capture-gateway: capture-gateway:latest
  ingestion-api: ingestion-api:latest
  detection-worker: detection-worker:latest
  feed-emulator: feed-emulator:latest
  web-api: web-api:latest
  web-dashboard: web-dashboard:latest

captureGateway:
  replicaCount: 1
  storage:
    size: 2Gi
    storageClass: ""
  buffer:
    maxDepth: 500000
    settledIdRetentionHours: 24
    quarantineRetentionHours: 168
    quarantineMaxRows: 10000
  uploader:
    batchSize: 200
    idleDelayMs: 500
    baseBackoffSeconds: 1
    maxBackoffSeconds: 30
    uploadTimeoutSeconds: 30
  resources: {}

ingestionApi:
  replicaCount: 1
  kafkaReadinessTimeoutSeconds: 3
  resources: {}

detectionWorker:
  replicaCount: 1
  kafkaGroupId: detection-group
  kafkaReadinessTimeoutSeconds: 3
  consumer:
    baseBackoffSeconds: 1
    maxBackoffSeconds: 30
  outbox:
    idleDelayMs: 500
    baseBackoffSeconds: 1
    maxBackoffSeconds: 30
    publishedRetentionHours: 168
    maintenanceIntervalSeconds: 30
  velocity:
    # Prototype: this chart installs no Redis. Point this at an external/managed Redis
    # endpoint reachable from the detection pods. Velocity state is derived cache only;
    # when the endpoint is unreachable detection degrades to VelocityStatus Unavailable
    # instead of failing. TODO: TLS/auth for the velocity store. Do not present this
    # endpoint as production cache without that hardening.
    configuration: tx-monitoring-redis:6379
  migration:
    # One-shot schema owner. Detection is the sole migration owner: workers in
    # Production never call MigrateAsync (migrate-on-startup is Development-only in code)
    # so replicas cannot race this Job; they stay unready on the postgres_migrations
    # readiness check until the schema is current. Run the Job once per release before
    # the worker Deployment rolls, e.g.: helm upgrade --wait with this Job enabled.
    enabled: true
    backoffLimit: 3
    activeDeadlineSeconds: 600
    ttlSecondsAfterFinished: 600
  resources: {}

feedEmulator:
  # ReplicaId owns a distinct account-number range. Keep replicaCount at one; add separately
  # configured releases (with different replicaId values) when demonstrating a larger fleet.
  replicaCount: 1
  replicaId: 0
  accountCount: 4
  intervalSeconds: 2
  bufferCapacity: 10000
  resources: {}

webApi:
  replicaCount: 1
  kafkaGroupId: web-api-dashboard-group
  kafkaReadinessTimeoutSeconds: 3
  # Set this to the exact public dashboard origin. Multiple origins are comma-separated.
  corsAllowedOrigins: http://localhost
  resources: {}

webDashboard:
  replicaCount: 1
  resources: {}

externalSecret:
  enabled: false
  apiVersion: external-secrets.io/v1beta1
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  # When enabled, set each remote key. `property` is optional for a scalar remote secret.
  remoteRefs:
    postgresConnectionString:
      key: ""
      property: ""
    postgresPassword:
      key: ""
      property: ""

istio:
  enabled: false
  sidecarInjection: false
  gatewaySelector:
    istio: ingressgateway
  hosts:
    - "*"

# Dependency configuration. PostgreSQL reads its password from the same pre-provisioned Secret as
# the detection worker; no database credentials are committed in this values file.
postgresql:
  enabled: true
  fullnameOverride: tx-monitoring-postgresql
  auth:
    enablePostgresUser: false
    username: txmonitoring
    database: tx_monitoring
    existingSecret: tx-monitoring-secrets
    secretKeys:
      userPasswordKey: postgres-password
  primary:
    persistence:
      enabled: true
      size: 8Gi

# Applications currently support only Kafka's PLAINTEXT client protocol. Internal broker traffic
# keeps the dependency defaults; adding application SASL/TLS configuration is separate hardening.
kafka:
  enabled: true
  fullnameOverride: tx-monitoring-kafka
  listeners:
    client:
      protocol: PLAINTEXT
  controller:
    replicaCount: 1
    controllerOnly: false
    persistence:
      enabled: true
      size: 8Gi
  broker:
    replicaCount: 0
  extraConfig: |
    auto.create.topics.enable=false
    offsets.topic.replication.factor=1
    transaction.state.log.min.isr=1
    transaction.state.log.replication.factor=1
  provisioning:
    enabled: true
    # Keep this as a normal Job. A post-install hook can deadlock `helm --wait`, because the
    # application readiness checks require these topics before Helm would run the hook.
    useHelmHooks: false
    numPartitions: 6
    # Single-broker local demo: replication factor 1 proves nothing about broker-loss
    # durability. Production-shaped topology (Terraform) uses replication factor 3 with
    # min.insync.replicas=2; producers already use Acks.All with idempotence enabled.
    replicationFactor: 1
    topics:
      - name: *eventsTopic
        partitions: 6
        replicationFactor: 1
      - name: *alertsTopic
        partitions: 6
        replicationFactor: 1
      - name: *deadLetterTopic
        partitions: 6
        replicationFactor: 1

# These backends are retained as optional dependencies, but disabled by default because an OTLP
# Collector and persistent-storage/retention choices have not yet been designed for this chart.
kube-prometheus-stack:
  enabled: false

tempo:
  enabled: false

loki:
  enabled: false
