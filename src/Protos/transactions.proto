syntax = "proto3";

package txmonitoring.ingestion.v1;
option csharp_namespace = "TxMonitoring.Ingestion.V1";

import "google/protobuf/timestamp.proto";

// Capture gateway to ingestion API. This carries an event feed for monitoring. "Capture"
// here does not mean the payments sense of settling an authorisation.
service TransactionIngestion {
  // Unary
  rpc UploadTransactions (UploadTransactionsRequest) returns (IngestResponse);
}

// One message carries a whole batch, bounded by the server's MaxReceiveMessageSize
// (default 4 MiB). Varints and strings vary in size, so a test checks the largest valid
// batch against that limit.
message UploadTransactionsRequest {
  repeated TransactionRecord transactions = 1;
}

// One monitored observation of a synthetic outbound debit attempt.
// AmountMinor is integer minor units (e.g. cents). Risk is computed downstream, not sent.
message TransactionRecord {
  // UUID minted by the synthetic origin; the idempotency key end to end.
  string message_id = 1;

  // Opaque synthetic account key; the Kafka partition key downstream.
  string account_id = 2;

  // Monotonic per account within one generator run; resets on restart.
  int64 sequence_number = 3;

  // Origin event time, millisecond resolution.
  google.protobuf.Timestamp occurred_at = 4;

  // Attempted debit in positive integer minor units, bounded by policy.
  int64 amount_minor = 5;

  // Uppercase three-letter code. Only CAD is accepted today.
  string currency = 6;

  // W3C trace context, carried as a Kafka header after ingestion.
  string traceparent = 7;
}

message IngestResponse {
  // True only when every submitted record was classified as accepted or permanently
  // rejected. False when a transient failure left IDs unnamed and still with the gateway.
  // "Accepted" means Kafka acknowledged the write, not a payment approval.
  bool complete = 1;

  repeated string accepted_message_ids = 2;

  repeated string rejected_message_ids = 3;
}

// Field numbers are part of the wire contract and are frozen. The ingestion descriptor
// tests pin every service, RPC, field number, cardinality, and type.
