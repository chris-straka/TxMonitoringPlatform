services:
  ingestion-api:
    # E2E images use separate tags so this harness cannot replace the images used by the normal
    # development Compose project.
    image: txmonitoring-e2e-ingestion-api
    ports: !reset []
    environment:
      Kafka__ReadinessTimeoutSeconds: "3"

  capture-gateway:
    image: txmonitoring-e2e-capture-gateway
    ports: !reset []
    environment:
      Buffer__QuarantineRetentionHours: "168"
      Buffer__QuarantineMaxRows: "10000"
      Uploader__IdleDelayMs: "100"
      Uploader__BaseBackoffSeconds: "1"
      Uploader__MaxBackoffSeconds: "2"
      Uploader__UploadTimeoutSeconds: "3"

  detection-worker:
    image: txmonitoring-e2e-detection-worker
    environment:
      Kafka__DeadLetterTopic: transaction-events-dlq
      Kafka__ReadinessTimeoutSeconds: "3"
      Consumer__BaseBackoffSeconds: "1"
      Consumer__MaxBackoffSeconds: "2"
      Outbox__IdleDelayMs: "100"
      Outbox__BaseBackoffSeconds: "1"
      Outbox__MaxBackoffSeconds: "2"
      Outbox__PublishedRetentionHours: "168"
      Outbox__MaintenanceIntervalSeconds: "5"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    # No published ports: same isolation convention as postgres/kafka.
    ports: !reset []

  postgres:
    ports: !reset []

  kafka:
    ports: !reset []

  kafka-init:
    # Keep this self-contained even if the main Compose file has not yet added the DLQ topic.
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic transaction-events --partitions 6 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic risk-alerts --partitions 6 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic transaction-events-dlq --partitions 6 --replication-factor 1
